# ─── Terminal capabilities ──────────────────────────────
# tmux-256color has a better terminfo than screen-256color (kf9/kf10, rev,
# ind, el1, and the kitty cursor-style/underline capabilities).
# NOTE: requires a full `tmux kill-server` to take effect on new panes.
set -g default-terminal "tmux-256color"

# Declared explicitly rather than relying on Ghostty auto-detection: tmux only
# learned to identify Ghostty in 3.8, and on 3.6a it is not in the detection
# table, so these have to be requested by hand.
#   sync       - synchronized output (DECSET 2026); without it, TUI apps that
#                repaint every frame (Claude Code, Docker CLI) tear/flicker
#   hyperlinks - OSC 8 links currently die at the tmux boundary
#   osc7       - lets Ghostty track `cd` through tmux (titlebar proxy icon)
#   extkeys    - extended key reporting outward to Ghostty
# RGB is set by COLORTERM=truecolor on tmux 3.6+, but declared here so the
# config does not silently depend on the outer environment.
#
# `-gu` first unsets the array so tmux falls back to its own built-in
# defaults, then ours are appended. Without this, every reload would append
# another copy of the same entries (set -as never de-duplicates).
set -gu terminal-features
set -as terminal-features '*:RGB'
set -as terminal-features '*:extkeys'
set -as terminal-features '*:sync'
set -as terminal-features '*:hyperlinks'
set -as terminal-features '*:osc7'
set -as terminal-features '*:strikethrough'
set -as terminal-features '*:overline'
set -as terminal-features '*:usstyle'
set -as terminal-features '*:margins'
set -as terminal-features '*:ignorefkeys'

# ─── Extended keys ────────────────────────
# Restored. These were only present in the old, unused ~/.tmux.conf, so when
# the server was recreated they silently reverted to tmux's defaults
# (extended-keys off, format xterm). The visible symptom was Shift+Enter
# arriving as a plain Enter: Option+Enter still worked because
# macos-option-as-alt turns Option into Alt, which is a distinct modifier the
# terminal encodes anyway. Shift+Enter is only distinguishable if tmux asks the
# outer terminal to encode modified keys - which is what these do.
#
# `*:extkeys` above is the other half: it lets tmux receive that encoding from
# the outer terminal in the first place.
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# Regenerate the cheatsheet from the live keymaps.
bind -n F1 run-shell "~/.config/tmux/scripts/cheatsheet.sh"

# ─── Fuzzy switchers ─────────────────────
# tmux 3.8 has `switch-mode` for this, but we are staying on 3.6a, so
# choose-tree is the equivalent. Tab/Shift-Tab are what 3.8 would bind, so
# the muscle memory carries over if you ever upgrade.
bind -T prefix Tab   choose-tree -Zs -w
bind -T prefix BTab  choose-tree -Zs -s

# ─── Status producer ────────────────────
# ONE long-lived process that polls slowly and writes git state into
# @git_branch. The status bar then reads that as a plain #{...} format,
# so showing git costs zero shell forks per redraw - unlike a #(shell) call,
# which tmux re-runs on every redraw (rate-limited to 1/sec, and each fork
# copies the server's page tables).
#
# The @git_producer pid is used as a liveness marker: if the process dies,
# a later reload restarts it.
# The producer clears @git_producer in an EXIT trap, so a crashed producer
# leaves the marker unset and the next reload brings it back.
if-shell -F '[ -z "#{@git_producer}" ]' {
  run-shell -b "~/.config/tmux/scripts/git-producer.sh"
}

set -g mouse on

set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g history-limit 1000000     # increase history size (from 2,000)
set -g detach-on-destroy off     # don't exit from tmux when closing a session

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# catppuccin config
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%d-%m-%Y %H:%M"

# restart config
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Battery
#
# tmux only runs a #(shell) call that sits at the *top level* of a format
# string. It never runs one nested inside #{...}. The catppuccin battery
# module stores its icon as the token "#{battery_icon}", and tmux-battery
# rewrites that token to "#(/path/battery_icon.sh)" - i.e. nested inside a
# #{...}, so tmux just printed the raw command as text. Hence the module is
# dropped from @catppuccin_status_modules_right above and appended by hand
# here, with the two shell calls at the top level of status-right.
#
# tmux-battery is kept as a manual plugin (so TPM keeps the scripts on disk
# and never sources battery.tmux, which is what caused the nesting).
set -g @manual_plugins 'tmux-plugins/tmux-battery'
set -ag status-right "#[fg=#b4befe,bg=default,nobold,nounderscore,noitalics]#{@catppuccin_status_left_separator}#[fg=#1e1e2e,bg=#b4befe,nobold,nounderscore,noitalics]#($HOME/.config/tmux/plugins/tmux-battery/scripts/battery_icon.sh 2>/dev/null) #[fg=#cdd6f4,bg=#313244] #($HOME/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh 2>/dev/null)#[fg=#313244,bg=default,nobold,nounderscore,noitalics]#{@catppuccin_status_right_separator}"

# Git branch, fed by the status producer above.
#
# `E:` is required. Without it tmux substitutes @git_module verbatim and never
# re-reads it, so the #[fg=...] styles inside would print as literal text.
# `E:` re-expands the result - and crucially it does NOT run #(shell) calls,
# which is exactly why the battery module above must not use it.
set -ag status-right "#{E:@git_module}"
